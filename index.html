<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Proposta indipendente di sito per Forno Trigo, forno contemporaneo in via Giulia di Barolo 25/A, Torino. Dati e identità da confermare.">
  <meta name="theme-color" content="#EBE6D9">
  <title>Forno Trigo — Proposta di sito, Torino</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenuto">Vai al contenuto</a>
  <div class="demo-banner"><span data-copy="demo.banner"></span><span class="banner-detail" data-copy="demo.detail"></span></div>
  <header class="site-header wrap">
    <a class="site-name site-logo" href="#inizio" aria-label="Forno Trigo, inizio pagina"><img data-brand-logo src="img/trigo-logo.svg" alt="TRIGO" width="750" height="460"></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigazione" hidden>Menu <span aria-hidden="true">+</span></button>
    <nav class="primary-nav" id="navigazione" aria-label="Navigazione principale"></nav>
  </header>

  <main id="contenuto">
    <section class="hero wrap" id="inizio" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow" data-copy="hero.eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="hero-description" data-copy="hero.description"></p>
        <div class="hero-actions">
          <a class="button button-solid" data-link="maps"><span data-copy="actions.maps"></span><span aria-hidden="true">↗</span></a>
          <a class="text-link" href="#il-forno"><span data-copy="actions.discover"></span><span aria-hidden="true">↓</span></a>
        </div>
        <div class="hero-address"><span class="tiny-mark" aria-hidden="true"></span><div><span data-copy="address.street"></span><small data-copy="address.area"></small></div></div>
        <p class="hours-preview"><span data-copy="contact.hoursTitle"></span><span class="pending-tag">[DA CONFERMARE]</span></p>
      </div>
      <figure class="hero-art">
        <img src="img/finestrella.svg" alt="Illustrazione concettuale di una finestra con forme di pane e dolci; non raffigura il locale reale." width="480" height="540" fetchpriority="high">
        <figcaption data-copy="hero.caption"></figcaption>
      </figure>
    </section>

    <div class="type-strip" aria-hidden="true"><span>PANE</span><i>✳</i><span>DOLCI DA FORNO</span><i>✳</i><span>VANCHIGLIA</span><i>✳</i><span>TORINO</span></div>

    <section class="story wrap section-space" id="il-forno" aria-labelledby="story-title">
      <div><p class="section-index" data-copy="story.index"></p><h2 id="story-title"></h2></div>
      <div class="story-body"><p class="large-copy" data-copy="story.intro"></p><p data-copy="story.description"></p><p class="source-note" data-copy="story.note"></p><a class="text-link" data-link="instagram"><span data-copy="actions.instagram"></span><span aria-hidden="true">↗</span></a></div>
    </section>

    <section class="offer wrap section-space" id="la-proposta" aria-labelledby="offer-title">
      <div class="section-heading"><div><p class="section-index" data-copy="offer.index"></p><h2 id="offer-title" data-copy="offer.title"></h2></div><p class="section-side-note" data-copy="offer.note"></p></div>
      <p class="calendar-source" data-copy="offer.source"></p>
      <div class="bread-calendar" id="calendario-pane"></div>
      <p class="menu-note"><span class="pending-tag">[DA CONFERMARE]</span><span data-copy="offer.menuNote"></span></p>
      <aside class="bakery-sweets" aria-labelledby="sweets-title"><h3 id="sweets-title" data-copy="offer.sweets.title"></h3><div><p data-copy="offer.sweets.description"></p><a class="text-link" data-link="instagram"><span data-copy="offer.sweets.action"></span><span aria-hidden="true">↗</span></a></div></aside>
    </section>

    <section class="visit" id="dove" aria-labelledby="visit-title">
      <div class="wrap visit-grid">
        <div class="visit-intro"><p class="section-index" data-copy="contact.index"></p><h2 id="visit-title"></h2><address><span data-copy="address.street"></span><span data-copy="address.area"></span></address><a class="button button-light" data-link="maps"><span data-copy="actions.maps"></span><span aria-hidden="true">↗</span></a></div>
        <div class="visit-info">
          <div class="info-row"><h3 data-copy="contact.hoursTitle"></h3><span class="pending-tag">[DA CONFERMARE]</span><p data-copy="contact.hoursNote"></p></div>
          <div class="info-row"><h3 data-copy="contact.socialTitle"></h3><a class="social-handle" data-link="instagram"><span data-copy="social.handle"></span><span aria-hidden="true">↗</span></a><p data-copy="contact.socialNote"></p></div>
          <div class="info-row"><h3 data-copy="contact.ordersTitle"></h3><span class="pending-tag">[DA CONFERMARE]</span><p data-copy="contact.ordersNote"></p></div>
        </div>
      </div>
    </section>

    <section class="faq wrap section-space" aria-labelledby="faq-title"><div><p class="section-index" data-copy="faq.index"></p><h2 id="faq-title" data-copy="faq.title"></h2></div><div id="domande" class="faq-list"></div></section>
  </main>

  <footer class="site-footer wrap"><div><a class="site-name site-logo" href="#inizio" aria-label="Forno Trigo, inizio pagina"><img data-brand-logo src="img/trigo-logo.svg" alt="TRIGO" width="750" height="460" loading="lazy"></a><p data-copy="demo.footer"></p></div><div class="footer-links"><a data-link="instagram">Instagram <span aria-hidden="true">↗</span></a><button class="note-button" type="button" id="open-notes" data-copy="demo.notesButton"></button><a href="#inizio">Torna su <span aria-hidden="true">↑</span></a></div></footer>
  <dialog class="demo-dialog" id="demo-notes" aria-labelledby="notes-title"><div class="dialog-top"><p class="eyebrow">Informazioni sulla proposta</p><button class="close-dialog" type="button" aria-label="Chiudi note">×</button></div><h2 id="notes-title" data-copy="demo.notesTitle"></h2><p data-copy="demo.notesBody"></p><p data-copy="demo.brandNote"></p><h3>Fonti pubbliche</h3><ul id="fonti"></ul><p class="source-note" data-copy="demo.privacyNote"></p></dialog>
  <noscript><div class="noscript-note"><h2>Forno Trigo, Torino</h2><p>Demo indipendente per il forno in via Giulia di Barolo 25/A, Vanchiglia. Orari, menu e identità visiva da confermare.</p><p><a href="https://www.google.com/maps/search/?api=1&amp;query=Forno+Trigo+Via+Giulia+di+Barolo+25A+Torino">Come arrivare su Google Maps</a> · <a href="https://www.instagram.com/fornotrigo/">Instagram @fornotrigo</a></p><p>Attiva JavaScript per vedere la proposta completa.</p></div></noscript>
</body>
</html>
